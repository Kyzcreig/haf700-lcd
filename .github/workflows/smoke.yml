name: smoke

on:
  push:
    paths-ignore: ['CHANGELOG.md', 'README.md', 'docs/**']  # fleet R14 (t_e47ee8bf): skip commits that cannot change the result
    branches: [main]
  pull_request:
    paths-ignore: ['CHANGELOG.md', 'README.md', 'docs/**']  # fleet R14 (t_e47ee8bf): skip commits that cannot change the result
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Smoke + unit tests
        run: python -m pytest -v test_haf700_lcd.py
      - name: CLI launches (entry-point smoke)
        run: |
          python haf700_lcd.py --version
          python haf700_lcd.py --help
